<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login | Sahyadri Resorts</title>
<style>
    /* Dark Tech Theme */
    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; 
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #e2e8f0;
    }

    /* Glow Card */
    .login-box {
        background: #1e293b;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
        border: 1px solid #334155;
        width: 350px;
        text-align: center;
    }

    h2 {
        color: #00f2fe;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        margin-bottom: 30px;
        letter-spacing: 2px;
    }

    label {
        font-size: 11px;
        text-transform: uppercase;
        color: #94a3b8;
        display: block;
        text-align: left;
        margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #0f172a;
        color: #fff;
        outline: none;
        box-sizing: border-box;
    }

    input:focus {
        border-color: #00f2fe;
        box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
    }

    input[type="submit"] {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 6px;
        background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
        color: #0f172a;
        font-weight: 800;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="submit"]:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
    }

    .signup-link {
        margin-top: 20px;
        font-size: 13px;
        color: #94a3b8;
    }

    .signup-link a {
        color: #00f2fe;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>

    <div class="login-box">
        <h2>Sahyadri Login</h2>
        
        <form action="Login" method="post">
            <label>Username</label>
            <input type="text" name="uName" placeholder="Enter Username" required>
            
            <label>Password</label>
            <input type="password" name="uPass" placeholder="Enter Password" required>
            
            <input type="submit" value="SIGN IN">
        </form>
        
        <div class="signup-link">
            New to Sahyadri? 
            <a href="SignUp.html">Create Account</a>
        </div>
    </div>

</body>
</html>
